---
profile: zyxel_scr50axe
target: ipq50xx
subtarget: generic
description: Build image for the Zyxel SCR50AXE
image: bin/targets/ipq50xx/generic/openwrt-ipq50xx-zyxel_scr50axe-squashfs-sysupgrade.tar
feeds:
  - name: ipq807x
    path: ../../feeds/ipq807x_v5.4
include:
  - ucentral-ap
  - webui
packages:
  - ipq50xx
  - ucode
  - ucode-mod-math
  - ucode-mod-resolv
  - ucode-mod-rtnl
  - ucode-mod-struct
  - ucode-mod-uci
  - wpad-openssl
  - wireless-regdb
  - iptables-mod-physdev
  - iperf3
  - ethtool
  - htop

diffconfig: |
  CONFIG_NET_IP_TUNNEL=y
  CONFIG_KERNEL_IPQ_MEM_PROFILE=512
  CONFIG_BUSYBOX_CUSTOM=y
